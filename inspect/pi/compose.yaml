services:
  default:
    build:
      context: .
      dockerfile: Dockerfile
    image: mattbench-inspect-pi:1.1.0-v1
    init: true
    command: sleep infinity
    working_dir: /workspace
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
